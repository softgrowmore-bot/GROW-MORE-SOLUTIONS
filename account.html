<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account</title><style>
body{margin:0;background:#070a0d;color:#fff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#11171d;border:1px solid #2a3540;border-radius:16px;padding:20px}.muted{color:#9da7b2}.ok{color:#19d17f}.bad{color:#ff7777}.btn{display:inline-block;padding:10px 13px;border-radius:9px;background:#f0c24b;color:#111;font-weight:900;text-decoration:none;border:0;cursor:pointer}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #27313a;text-align:left}button{padding:10px 13px;border:0;border-radius:9px;background:#f0c24b;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>My Account</h1><p id="who" class="muted"></p></div><div><a class="btn" href="/">Website</a> <button onclick="logout()">Logout</button></div></div><h2>My Products</h2><div id="products" class="grid"></div><h2>Order History</h2><div class="card table"><table><thead><tr><th>Order</th><th>Product</th><th>Plan</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders"></tbody></table></div></div><script>
async function load(){const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.user){location.href='/login.html';return}who.textContent=me.user.name+' · '+me.user.email;const [p,o]=await Promise.all([fetch('/api/me/products').then(r=>r.json()),fetch('/api/me/orders').then(r=>r.json())]);products.innerHTML=p.length?p.map(x=>`<div class="card"><h3>${x.name}</h3><p class="muted">${x.plan}</p><p class="${x.active?'ok':'bad'}">${x.active?'ACTIVE':'EXPIRED'}${x.expires_at?' · Expires '+new Date(x.expires_at).toLocaleString():''}</p>${x.active?`<a class="btn" href="/api/download/${x.id}">Download Product</a>`:''}</div>`).join(''):'<div class="card">No paid products yet.</div>';orders.innerHTML=o.map(x=>`<tr><td>${x.order_id}</td><td>${x.name}</td><td>${x.plan}</td><td>₹${x.amount}</td><td>${x.status}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/'}load();</script></body></html>
