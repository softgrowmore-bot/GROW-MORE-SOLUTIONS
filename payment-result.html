<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Result</title><style>body{margin:0;background:#070a0d;color:#fff;font-family:Arial}.box{max-width:650px;margin:10vh auto;padding:30px;background:#11171d;border:1px solid #2a3540;border-radius:18px}.ok{color:#19d17f}.wait{color:#f0c24b}.btn{display:inline-block;padding:13px 17px;background:#f0c24b;color:#111;border-radius:10px;font-weight:900;text-decoration:none}</style></head><body><div class="box"><h1 id="title">Checking payment…</h1><p id="text"></p><a class="btn" href="/account.html">Open My Account</a></div><script>
(async()=>{const id=new URLSearchParams(location.search).get('order_id');if(!id){title.textContent='Missing order ID';return}for(let i=0;i<3;i++){const r=await fetch('/api/cashfree/verify/'+encodeURIComponent(id));const j=await r.json();if(j.order?.status==='PAID'){title.className='ok';title.textContent='Payment successful';text.textContent='Your product access has been activated.';return}await new Promise(x=>setTimeout(x,1500))}title.className='wait';title.textContent='Payment status pending';text.textContent='If Cashfree is still confirming the payment, refresh your account shortly. Your access is granted only after verified payment.'})()</script></body></html>
