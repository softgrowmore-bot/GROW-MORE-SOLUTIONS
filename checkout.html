<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — GROW MORE SOLUTIONS</title><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><style>
:root{--bg:#050807;--card:#101814;--line:#2b3b32;--gold:#f4c542;--green:#19e083;--muted:#a8b4ae}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 450px at 75% 0,#0b3320,#07120d 45%,#050807 80%);color:#fff;font-family:Inter,Arial,sans-serif}.box{width:min(700px,92vw);margin:6vh auto;padding:30px;background:#10161b;border:1px solid #2a3941;border-radius:22px;box-shadow:0 30px 90px #0008}a{color:var(--gold)}.plan{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.p{padding:18px;border:1px solid #34404c;border-radius:14px;cursor:pointer}.p.active{border-color:var(--gold);background:#19170f}.price{font-size:30px;color:var(--gold);font-weight:900}.muted{color:var(--muted);line-height:1.65}button{padding:15px 20px;border:0;border-radius:12px;background:var(--gold);font-weight:900;cursor:pointer}.msg{margin-top:15px;color:var(--green)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.step{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b120e;font-size:13px}.step b{display:block;margin-bottom:5px;color:var(--gold)}@media(max-width:600px){.plan,.steps{grid-template-columns:1fr}.box{margin:20px auto}}
</style></head><body><div class="box"><a href="/">← Website</a><h1 id="name">Loading…</h1><p id="desc" class="muted"></p><div class="steps"><div class="step"><b>1. Register</b>Customer account</div><div class="step"><b>2. Pay</b>Secure Cashfree checkout</div><div class="step"><b>3. Access</b>TradingView approval</div></div><div id="plans" class="plan"></div><p class="price" id="total"></p><button id="pay">Pay with Cashfree</button><p id="msg" class="msg"></p><p class="muted">Your TradingView invite-only access is manually approved after verified payment. Never share your TradingView password.</p></div><script>
let product,plan='Monthly';const qs=new URLSearchParams(location.search);const productId=qs.get('product');const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function init(){try{const [pr,me]=await Promise.all([fetch('/api/products',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()),fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json())]);if(!me.user){location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search));return}product=pr.find(x=>x.id==productId);if(!product){document.getElementById('name').textContent='Product not found';document.getElementById('pay').disabled=true;return}document.getElementById('name').textContent=product.name;document.getElementById('desc').textContent=product.description||'';render()}catch(e){document.getElementById('msg').textContent=e.message||'Unable to load checkout. Please refresh.'}}
function amount(){return Number(product?.[plan==='6 Months'?'six_months':plan.toLowerCase()]||0)||Number(product?.price||0)}
function render(){document.getElementById('plans').innerHTML=['Monthly','6 Months','Yearly','Lifetime'].map(x=>{const k=x==='Monthly'?'monthly':x==='6 Months'?'six_months':x==='Yearly'?'yearly':'lifetime';return `<div class="p ${x===plan?'active':''}" onclick="plan='${x}';render()"><b>${x}</b><br>${money(product[k])}</div>`}).join('');document.getElementById('total').textContent='Total: '+money(amount())}
document.getElementById('pay').onclick=async()=>{const pay=document.getElementById('pay'),msg=document.getElementById('msg');pay.disabled=true;msg.textContent='Creating secure payment…';try{const r=await fetch('/api/cashfree/create-order',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:product.id,plan})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Payment setup failed');const cf=Cashfree({mode:j.environment});cf.checkout({paymentSessionId:j.paymentSessionId,redirectTarget:'_self'})}catch(e){msg.textContent=e.message;pay.disabled=false}};init();</script></body></html>
