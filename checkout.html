<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — GROW MORE SOLUTIONS</title><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><style>
body{margin:0;background:#070a0d;color:#fff;font-family:Arial}.box{max-width:650px;margin:6vh auto;padding:28px;background:#11171d;border:1px solid #2a3540;border-radius:18px}.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px}.p{padding:15px;border:1px solid #34404c;border-radius:12px;cursor:pointer}.p.active{border-color:#f0c24b;background:#19170f}.price{font-size:28px;color:#f0c24b;font-weight:900}button{padding:14px 18px;border:0;border-radius:11px;background:#f0c24b;font-weight:900;cursor:pointer}.muted{color:#9da7b2}.msg{color:#19d17f}</style></head><body><div class="box"><a href="/">← Website</a><h1 id="name">Loading…</h1><p id="desc" class="muted"></p><div id="plans" class="plan"></div><p class="price" id="total"></p><button id="pay">Pay with Cashfree</button><p id="msg" class="msg"></p></div><script>
let product,plan='Monthly';
async function init(){const id=new URLSearchParams(location.search).get('product');const [p,me]=await Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/auth/me').then(r=>r.json())]);if(!me.user){location.href='/login.html';return}product=p.find(x=>x.id==id);if(!product){name.textContent='Product not found';return}name.textContent=product.name;desc.textContent=product.description||'';render()}
function amount(){return Number(product?.[plan==='6 Months'?'six_months':plan.toLowerCase()]||0)||Number(product?.price||0)}
function render(){plans.innerHTML=['Monthly','6 Months','Yearly','Lifetime'].map(x=>`<div class="p ${x===plan?'active':''}" onclick="plan='${x}';render()"><b>${x}</b><br>₹${Number(product[x==='Monthly'?'monthly':x==='6 Months'?'six_months':x==='Yearly'?'yearly':'lifetime']||0).toLocaleString('en-IN')}</div>`).join('');total.textContent='Total: ₹'+amount().toLocaleString('en-IN')}
pay.onclick=async()=>{pay.disabled=true;msg.textContent='Creating secure payment…';let r=await fetch('/api/cashfree/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:product.id,plan})});let j=await r.json();if(!r.ok){msg.textContent=j.error||'Payment setup failed';pay.disabled=false;return}const cf=Cashfree({mode:j.environment});cf.checkout({paymentSessionId:j.paymentSessionId,redirectTarget:'_self'})};
init();</script></body></html>
