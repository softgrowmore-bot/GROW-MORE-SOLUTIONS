<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login — GROW MORE SOLUTIONS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123524 0,#070a0d 42%,#050709 100%);color:#f5f7f9;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}
.box{width:min(480px,100%);padding:34px;background:rgba(17,23,29,.96);border:1px solid #30404b;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.logo{width:82px;height:82px;border-radius:50%;display:block;margin:0 auto 18px;object-fit:cover;border:2px solid #f0c24b}
h1{text-align:center;font-size:30px;margin:0 0 24px;letter-spacing:.3px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.tabs button{margin:0;background:#1a232c;color:#fff}.tabs button.active{background:#f0c24b;color:#111}
input{width:100%;padding:15px 14px;margin:7px 0;border-radius:11px;border:1px solid #34404c;background:#080b0e;color:white;outline:none;font-size:15px}input:focus{border-color:#18d77e;box-shadow:0 0 0 3px rgba(24,215,126,.1)}
button{width:100%;padding:15px;border:0;border-radius:11px;background:#f0c24b;font-weight:900;font-size:15px;margin-top:10px;cursor:pointer}.tabs button{margin-top:0}.muted{color:#9da7b2;font-size:14px}.msg{margin-top:14px;min-height:20px;color:#19d17f;line-height:1.4}.msg.error{color:#ff7272}.passwordRow{position:relative}.passwordRow input{padding-right:54px}.eye{position:absolute;right:7px;top:7px;width:42px;height:42px;margin:0;padding:0;background:transparent;color:#cbd5df;font-size:19px}.showPass{display:flex;align-items:center;gap:8px;color:#aeb8c2;font-size:13px;margin:4px 0 4px}.showPass input{width:auto;margin:0;accent-color:#19d17f}.back{color:#8b5cf6}.small{font-size:12px;color:#82909d;margin-top:6px}
</style>
</head>
<body>
<div class="box">
<img class="logo" src="/logo.jpeg" alt="GROW MORE SOLUTIONS">
<h1>GROW MORE SOLUTIONS</h1>
<div class="tabs"><button type="button" id="lt" class="active">Login</button><button type="button" id="rt">Register</button></div>
<form id="f" novalidate>
<div id="extra"></div>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<div class="passwordRow"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="eye" type="button" id="eye" aria-label="Show password">👁</button></div>
<label class="showPass"><input id="showPassword" type="checkbox"> Show password</label>
<button type="submit" id="submitBtn">Continue</button>
</form>
<p id="msg" class="msg"></p>
<p class="muted"><a class="back" href="/">← Back to website</a></p>
</div>
<script>
let currentMode='login';
const form=document.getElementById('f');
const loginTab=document.getElementById('lt');
const registerTab=document.getElementById('rt');
const extra=document.getElementById('extra');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const message=document.getElementById('msg');
const submitBtn=document.getElementById('submitBtn');
const showPassword=document.getElementById('showPassword');
const eye=document.getElementById('eye');

function mode(value){
  currentMode=value;
  loginTab.className=value==='login'?'active':'';
  registerTab.className=value==='register'?'active':'';
  extra.innerHTML=value==='register'
    ? '<input id="fullName" placeholder="Full name" autocomplete="name"><input id="phone" placeholder="Phone number" inputmode="tel" autocomplete="tel">'
    : '';
  emailInput.value='';
  passwordInput.value='';
  message.textContent='';
  message.className='msg';
  passwordInput.autocomplete=value==='register'?'new-password':'current-password';
  submitBtn.textContent=value==='register'?'Create Account':'Login';
}

loginTab.addEventListener('click',()=>mode('login'));
registerTab.addEventListener('click',()=>mode('register'));
showPassword.addEventListener('change',()=>{passwordInput.type=showPassword.checked?'text':'password'});
eye.addEventListener('click',()=>{const visible=passwordInput.type==='text';passwordInput.type=visible?'password':'text';showPassword.checked=!visible});

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  message.textContent='';
  message.className='msg';
  const email=String(emailInput.value||'').trim();
  const password=String(passwordInput.value||'');
  if(!email || !password){message.textContent='Email and password are required.';message.className='msg error';return;}
  const body={email,password};
  if(currentMode==='register'){
    const nameEl=document.getElementById('fullName');
    const phoneEl=document.getElementById('phone');
    const name=String(nameEl?.value||'').trim();
    const phone=String(phoneEl?.value||'').trim();
    if(!name){message.textContent='Please enter your full name.';message.className='msg error';return;}
    if(password.length<6){message.textContent='Password must be at least 6 characters.';message.className='msg error';return;}
    body.name=name;body.phone=phone;
  }
  submitBtn.disabled=true;submitBtn.textContent=currentMode==='register'?'Creating Account...':'Logging in...';
  try{
    const response=await fetch('/api/auth/'+currentMode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
    const data=await response.json().catch(()=>({}));
    if(!response.ok){message.textContent=data.error||'Something went wrong. Please try again.';message.className='msg error';return;}
    window.location.href='/account.html';
  }catch(err){message.textContent='Server connection failed. Please try again.';message.className='msg error';}
  finally{submitBtn.disabled=false;submitBtn.textContent=currentMode==='register'?'Create Account':'Login';}
});
</script>
</body>
</html>
