<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — GROW MORE SOLUTIONS</title><style>
body{margin:0;background:#070a0d;color:#f5f7f9;font-family:Arial}.box{max-width:420px;margin:8vh auto;padding:28px;background:#11171d;border:1px solid #2a3540;border-radius:18px}.logo{width:72px;height:72px;border-radius:50%;display:block;margin:auto}h1{font-size:26px}input{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #34404c;background:#080b0e;color:white;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:10px;background:#f0c24b;font-weight:900;margin-top:10px;cursor:pointer}.muted{color:#9da7b2;font-size:14px}.msg{margin-top:12px;color:#19d17f}.tabs{display:flex;gap:8px}.tabs button{background:#1a232c;color:#fff}.tabs button.active{background:#f0c24b;color:#111}</style></head><body><div class="box"><img class="logo" src="/logo.jpeg"><h1>GROW MORE SOLUTIONS</h1><div class="tabs"><button id="lt" class="active" onclick="mode('login')">Login</button><button id="rt" onclick="mode('register')">Register</button></div><form id="f"><div id="extra"></div><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Continue</button></form><p id="msg" class="msg"></p><p class="muted"><a href="/">← Back to website</a></p></div><script>
let m='login';function mode(v){m=v;lt.className=v==='login'?'active':'';rt.className=v==='register'?'active':'';extra.innerHTML=v==='register'?'<input id="name" placeholder="Full name" required><input id="phone" placeholder="Phone number">':''}
f.onsubmit=async e=>{e.preventDefault();const emailEl=document.getElementById('email');const passwordEl=document.getElementById('password');let body={email:emailEl.value.trim(),password:passwordEl.value};if(m==='register'){const nameEl=document.getElementById('name');const phoneEl=document.getElementById('phone');body.name=nameEl?nameEl.value.trim():'';body.phone=phoneEl?phoneEl.value.trim():''}let r=await fetch('/api/auth/'+m,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok){msg.textContent=j.error||'Error';return}location.href='/account.html'};</script></body></html>
